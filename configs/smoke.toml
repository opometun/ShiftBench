[experiment]
name = "smoke"
seed = 42
output_root = "../runs"
train_selection = {real = 1500, synthetic = 500}

[dataset]
path = "../data/sample/tiny_shiftbench.csv"
required_columns = [
  "sample_id",
  "split",
  "source",
  "label",
  "input",
]
id_column = "sample_id"
split_column = "split"
source_column = "source"
label_column = "label"
input_column = "input"
allowed_splits = ["train", "validation", "test"]
allowed_sources = ["real", "synthetic"]
