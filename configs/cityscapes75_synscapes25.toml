[experiment]
name = "cityscapes75_synscapes25"
seed = 42
output_root = "../runs/cityscapes75_synscapes25"
train_selection = {cityscapes = 1500, synscapes = 500}

[dataset]
path = "../data/study/cityscapes75_synscapes25.csv"
required_columns = [
  "sample_id",
  "split",
  "source_dataset",
  "mask_path",
  "img_path",
]
id_column = "sample_id"
split_column = "split"
source_column = "source_dataset"
label_column = "mask_path"
input_column = "img_path"
allowed_splits = ["train", "validation", "test"]
allowed_sources = ["cityscapes", "synscapes"]
num_classes = 19