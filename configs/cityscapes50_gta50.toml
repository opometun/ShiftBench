[experiment]
name = "cityscapes50_gta50"
seed = 42
output_root = "../runs/cityscapes50_gta50"
train_selection = {cityscapes = 1000, gtaV = 1000}

[dataset]
path = "../data/study/cityscapes50_gta50.csv"
required_columns = [
  "sample_id",
  "split",
  "source_dataset",
  "mask_path",
  "img_path",
]
id_column = "sample_id"
split_column = "split"
source_column = "source_dataset"
label_column = "mask_path"
input_column = "img_path"
allowed_splits = ["train", "validation", "test"]
allowed_sources = ["cityscapes", "gtaV"]
num_classes = 19

[shift]
metrics = ["color_js", "texture_js", "class_frequency_js", "class_presence_js", "scene_complexity_js", "frechet"]
image_column = "img_path"
mask_column = "mask_path"
num_classes = 19
manifest_a = "../data/study/cityscapes50_gta50.csv"
split_a = "train"
stats_a = "../runs/cityscapes50_gta50/frechet_dinov2/train_feature_stats.npz"
manifest_b = "../data/study/cityscapes50_gta50.csv"
split_b = "test"
stats_b = "../runs/cityscapes50_gta50/frechet_dinov2/test_feature_stats.npz"