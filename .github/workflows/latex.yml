name: Build LaTeX document

on:
  push:
    paths:
      - 'paper/**/*.tex'
      - 'paper/**/*.bib'
      - 'paper/**/*.sty'
      - 'paper/**/*.cls'
      - 'paper/**/*.png'
      - 'paper/**/*.jpg'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile LaTeX
      uses: xu-cheng/texlive-action@v2
      with:
        scheme: full
        run: |
          cd paper
          latexmk -pdf -interaction=nonstopmode code.tex

    - name: Upload PDF
      uses: actions/upload-artifact@v4
      with:
        name: compiled-paper
        path: paper/code.pdf
