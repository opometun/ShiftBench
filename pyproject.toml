[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftbench"
version = "0.1.0"
description = "Research benchmark for real and synthetic dataset mixture shifts."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
  { name = "ShiftBench contributors" }
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
features = [
  "torch>=2.2",
  "transformers>=4.40",
  "pillow>=10.0",
]
# Image- and label-based shift metrics (HSV/LBP histograms need OpenCV/skimage).
image = [
  "opencv-python>=4.8",
  "scikit-image>=0.22",
]
# SADGE additionally needs a vendored MASt3R checkout, not yet in the repo;
# see docs/integration-plan.md Phase 7.
sadge = [
  "opencv-python>=4.8",
  "torch>=2.2",
  "transformers>=4.40",
  "pillow>=10.0",
]

[project.scripts]
shiftbench-run = "shiftbench.experiments.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
